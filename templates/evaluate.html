<!doctype html>
<html data-theme="coffee">
  <head>
    <title>Evaluate</title>
    <link rel="stylesheet" href="/templates/output.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="/templates/utils.js"></script>
  </head>

  <body>
    <div class="flex flex-col min-h-screen bg-base-200 p-3">
      {{template "nav" .}}
      <main class="flex-1 flex flex-col gap-3 overflow-auto">
        <div class="card bg-base-100 shadow-lg p-4">
          <h2 class="text-center text-xl font-bold">{{.Model}}</h2>
          <h3 class="text-center text-base font-medium">
            Prompt {{inc (atoi .PromptIndex)}} of {{.TotalPrompts}}
          </h3>

          <form
            action="/evaluate?model={{.Model}}&prompt={{.PromptIndex}}"
            method="post"
          >
            <input
              type="hidden"
              name="score"
              id="selectedScore"
              value="{{.CurrentScore}}"
            />

            <div class="flex flex-wrap gap-2 justify-center py-4">
              {{range $label, $value := .ScoreOptions}}
              <button
                type="button"
                class="score-btn w-12 h-12 flex items-center justify-center font-bold rounded-lg shadow-sm cursor-pointer hover:opacity-80 transition-opacity"
                style="background-color: {{scoreColor $value}}; color: white"
                onclick="selectScoreButton('{{$value}}')"
                data-score="{{$value}}"
                aria-label="Score {{$label}}"
              >
                {{$label}}
              </button>
              {{end}}
            </div>

            <div class="flex items-center justify-center gap-2 py-4">
              <a
                href="/evaluate?model={{.Model}}&prompt={{if gt (atoi .PromptIndex) 0}}{{sub (atoi .PromptIndex) 1}}{{else}}{{.PromptIndex}}{{end}}"
                class="btn btn-info"
                aria-label="Previous prompt"
                {{if
                eq
                (atoi
                .PromptIndex)
                0}}style="visibility: hidden;"
                {{end}}
                >⬅️</a
              >
              <a
                href="/evaluate?model={{.Model}}&prompt={{if lt (atoi .PromptIndex) (sub .TotalPrompts 1)}}{{add (atoi .PromptIndex) 1}}{{else}}{{.PromptIndex}}{{end}}"
                class="btn btn-info"
                aria-label="Next prompt"
                {{if
                eq
                (atoi
                .PromptIndex)
                (sub
                .TotalPrompts
                1)}}style="visibility: hidden;"
                {{end}}
                >➡️</a
              >
              <span>_</span>
              <button
                type="button"
                class="btn btn-primary"
                onclick="copyPromptText()"
                aria-label="Copy prompt to clipboard"
              >
                📋
              </button>
              <span>_</span>
              <button
                type="submit"
                class="btn btn-success"
                aria-label="Submit score"
              >
                ✅
              </button>
              <a
                href="/results"
                class="btn btn-error"
                aria-label="Cancel and return to results"
                >❌</a
              >
            </div>
          </form>

          <div class="card bg-base-200 shadow-md p-4 my-4">
            <h4 class="font-semibold mb-2">Prompt:</h4>
            <div class="markdown-content">{{.PromptText | markdown}}</div>
          </div>
          <hr class="divider" />
          <div class="card bg-base-200 shadow-md p-4 my-4">
            <h4 class="font-semibold mb-2">Solution:</h4>
            <div class="markdown-content">{{.Solution | markdown}}</div>
          </div>
          <hr class="divider" />
          <div class="card bg-base-200 shadow-md p-4 my-4">
            <h4 class="font-semibold mb-2">Model Response:</h4>
            <textarea
              id="modelResponse"
              rows="10"
              placeholder="Model's response will appear here..."
              class="textarea textarea-bordered w-full"
              aria-label="Model response"
            >
{{.ModelResponse}}</textarea>
            <div class="mt-2">
              <button
                type="button"
                class="btn btn-primary"
                id="save-response-btn"
                onclick="saveModelResponse()"
              >
                💾 Save Response
              </button>
              <span id="save-status" aria-live="polite"></span>
            </div>
          </div>
        </div>

        <div class="hidden" id="raw-prompt-text">{{.PromptText}}</div>
        <script>
          let rawPromptMarkdown = document.getElementById("raw-prompt-text").textContent.trim();

          function selectScoreButton(score) {
            document.getElementById("selectedScore").value = score;
            document.querySelectorAll("[data-score]").forEach(b => b.style.border = 'none');
            document.querySelector(`button[data-score="${score}"]`).style.border = '4px solid white';
          }

          document.addEventListener("DOMContentLoaded", function() {
            const currentScore = document.getElementById("selectedScore").value;
            const currentButton = document.querySelector(
              `button[data-score="${currentScore}"]`,
            );
            if (currentButton) {
              currentButton.style.border = '4px solid white';
            }
          });

          function copyPromptText() {
            navigator.clipboard.writeText(rawPromptMarkdown)
              .then(() => {
                const copyButton = document.querySelector('button[aria-label="Copy prompt to clipboard"]');
                const originalText = copyButton.textContent;
                copyButton.textContent = 'Copied!';

                setTimeout(() => {
                  copyButton.textContent = "📋";
                }, 2000);
              })
              .catch(err => {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy text. Please try again.');
              });
          }

          function saveModelResponse() {
            const responseText = document.getElementById('modelResponse').value;
            const statusSpan = document.getElementById('save-status');
            const saveButton = document.getElementById('save-response-btn');

            saveButton.disabled = true;
            statusSpan.textContent = 'Saving...';

            fetch('/save_model_response', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model_id: {{.ModelID}},
                prompt_id: {{.PromptID}},
                response_text: responseText,
              }),
            })
            .then(response => response.json())
            .then(data => {
              saveButton.disabled = false;
              if (data.success) {
                statusSpan.textContent = 'Saved!';
                setTimeout(() => statusSpan.textContent = '', 2000);
              } else {
                statusSpan.textContent = 'Error: ' + (data.message || 'Unknown error');
              }
            })
            .catch(error => {
              console.error('Error saving response:', error);
              saveButton.disabled = false;
              statusSpan.textContent = 'Error: Failed to save';
            });
          }
        </script>
      </main>

      <div class="fixed left-4 bottom-4 flex flex-col gap-2 z-[1000]">
        <button
          class="btn btn-info"
          onclick="scrollToTop()"
          aria-label="Scroll to top"
        >
          ↑
        </button>
        <button
          class="btn btn-info"
          onclick="scrollToBottom()"
          aria-label="Scroll to bottom"
        >
          ↓
        </button>
      </div>
    </div>
  </body>
</html>
